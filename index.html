<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        canvas { display: block; }
        #intro { position: absolute; top: 30%; left: 35%; color: white; text-align: center; pointer-events: auto; }
        button { padding: 15px 30px; font-size: 20px; background: #ff4500; color: white; border: none; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="intro">
        <h1>SACK DRAINERS</h1>
        <button onclick="initGame()">GAME ON</button>
    </div>

    <canvas id="gc"></canvas>

    <script>
        const canvas = document.getElementById("gc");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let game = {
            level: 0,
            money: 0,
            inventory: ['Plunger'],
            player: { x: 100, y: 300, frame: 0 },
            locations: ["Gas Station", "Random Home", "President's House"]
        };

        function drawCharacter(x, y) {
            // Legs/Walking animation simulation
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(x, y + 50, 20, 60); // Body
            ctx.fillStyle = "black";
            ctx.fillRect(x - 5, y, 30, 20); // Durag
            ctx.fillStyle = "#ff4500";
            ctx.fillRect(x + 5, y + 60, 10, 20); // Plunger
        }

        function initGame() {
            document.getElementById("intro").style.display = "none";
            loop();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Environment (Simplified based on image_aef428.jpg)
            ctx.fillStyle = "#a9a9a9";
            ctx.fillRect(0, 400, canvas.width, 200); // Floor
            
            drawCharacter(game.player.x, game.player.y);
            
            // UI Overlay
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Inventory: " + game.inventory.join(', '), 20, 30);
            ctx.fillText("Location: " + game.locations[game.level], 20, 60);
            ctx.fillText("Money: $" + game.money, 20, 90);

            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') game.player.x += 10;
            if(e.key === 'ArrowLeft') game.player.x -= 10;
            if(e.key === ' ') {
                game.money += 10;
                if(game.money >= 50) {
                    game.level = (game.level + 1) % game.locations.length;
                    game.money = 0;
                    game.player.x = 100;
                }
            }
        });
    </script>
</body>
</html>
