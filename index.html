<!DOCTYPE html>
<html>
<head>
    <title>Sack Drainers</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; text-align: center; font-family: 'Arial', sans-serif; }
        canvas { background: #f0f0f0; display: block; margin: 10px auto; border: 8px solid #333; }
        .menu { padding: 20px; }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #444; color: white; border: none; }
    </style>
</head>
<body>
    <div id="gameUI">
        <h1>Sack Drainers</h1>
        <div id="menu" class="menu">
            <h3>Select Location:</h3>
            <button onclick="startGame(0)">Public Restroom</button>
            <button onclick="startGame(1)">Gas Station</button>
            <button onclick="startGame(2)">Luxury Hotel</button>
        </div>
        <div id="gameBoard" style="display:none;">
            <div id="ui">Money: $<span id="money">0</span> | Location: <span id="loc"></span></div>
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <button onclick="location.reload()">Exit to Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let game = { active: false, money: 0, level: 0, 
            locations: ["Public Restroom", "Gas Station", "Luxury Hotel"],
            bgColors: ["#dcdcdc", "#fffacd", "#ffd700"] 
        };

        let player = { x: 100, y: 250 };

        function drawCharacter() {
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";

            // Arms
            ctx.beginPath();
            ctx.moveTo(player.x, player.y + 50);
            ctx.lineTo(player.x - 20, player.y + 80); // Left Arm
            ctx.moveTo(player.x + 30, player.y + 50);
            ctx.lineTo(player.x + 50, player.y + 80); // Right Arm
            ctx.stroke();

            // Legs
            ctx.beginPath();
            ctx.moveTo(player.x + 5, player.y + 100);
            ctx.lineTo(player.x - 10, player.y + 150); // Left Leg
            ctx.moveTo(player.x + 25, player.y + 100);
            ctx.lineTo(player.x + 40, player.y + 150); // Right Leg
            ctx.stroke();

            // Torso
            ctx.fillStyle = "#fff"; // Shirt
            ctx.fillRect(player.x, player.y + 40, 30, 60);

            // Head & Durag
            ctx.fillStyle = "#6b4423"; // Skin
            ctx.beginPath();
            ctx.arc(player.x + 15, player.y + 20, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "black"; // Durag
            ctx.fillRect(player.x, player.y + 5, 30, 10);
            ctx.fillRect(player.x - 5, player.y + 10, 40, 5); // Wrap
        }

        function drawToilet() {
            ctx.fillStyle = "#fff";
            ctx.fillRect(600, 310, 60, 50);
            ctx.fillStyle = "#eee";
            ctx.fillRect(610, 280, 40, 30);
        }

        function startGame(levelIndex) {
            game.level = levelIndex;
            game.money = 0;
            player.x = 100;
            document.getElementById("menu").style.display = "none";
            document.getElementById("gameBoard").style.display = "block";
            document.getElementById("loc").innerText = game.locations[game.level];
            game.active = true;
            animate();
        }

        function animate() {
            if (!game.active) return;
            ctx.fillStyle = game.bgColors[game.level];
            ctx.fillRect(0, 0, 800, 400);
            
            drawToilet();
            drawCharacter();
            requestAnimationFrame(animate);
        }

        window.addEventListener("keydown", (e) => {
            if (!game.active) return;
            if (e.key === "ArrowRight") player.x += 20;
            if (e.key === "ArrowLeft") player.x -= 20;
            if (e.key === " " && Math.abs(player.x - 550) < 50) {
                game.money += 10;
                document.getElementById("money").innerText = game.money;
                if (game.money >= 40) {
                    game.level = (game.level + 1) % game.locations.length;
                    game.money = 0;
                    player.x = 100;
                    document.getElementById("loc").innerText = game.locations[game.level];
                }
            }
        });
    </script>
</body>
</html>
