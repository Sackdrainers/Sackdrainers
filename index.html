<!DOCTYPE html>
<html>
<head>
    <title>Sack Drainers</title>
    <style>
        body { margin: 0; background: #333; color: white; text-align: center; font-family: sans-serif; }
        canvas { background: #eee; display: block; margin: 20px auto; border: 5px solid #555; }
    </style>
</head>
<body>
    <h1>Sack Drainers</h1>
    <p>Use Left/Right arrows to move. Press Space to pump the toilet!</p>
    <h2 id="money">Money: $0</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let money = 0;
        let player = { x: 50, y: 300, width: 40, height: 60 };
        let toilet = { x: 600, y: 320, width: 80, height: 50 };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Player (Durag character represented as a blue box)
            ctx.fillStyle = "blue";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "black";
            ctx.fillRect(player.x, player.y, player.width, 10); // Durag representation

            // Draw Toilet
            ctx.fillStyle = "white";
            ctx.fillRect(toilet.x, toilet.y, toilet.width, toilet.height);
            ctx.fillStyle = "grey";
            ctx.fillRect(toilet.x + 20, toilet.y - 20, 40, 20); // Tank

            requestAnimationFrame(draw);
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") player.x += 20;
            if (e.key === "ArrowLeft") player.x -= 20;
            if (e.key === " " && Math.abs(player.x - toilet.x) < 50) {
                money += 10;
                document.getElementById("money").innerText = "Money: $" + money;
            }
        });

        draw();
    </script>
</body>
</html>
