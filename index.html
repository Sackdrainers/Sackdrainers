<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 5px solid #fff; background-color: #dcdcdc; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game Objects
    let player = { x: 100, y: 350, speed: 15, holdingPlunger: true };
    let game = { money: 0, level: 0, locations: ["Gas Station", "Random Home", "President's House"] };

    // Function to draw the high-detail scene
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Bathroom Background (Detailed)
        ctx.fillStyle = "#a0a0a0"; // Floor
        ctx.fillRect(0, 450, 800, 150);
        ctx.strokeStyle = "#777";
        ctx.strokeRect(0, 450, 800, 150);

        // 2. Draw Toilet (Detailed)
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.ellipse(650, 500, 50, 40, 0, 0, Math.PI * 2);
        ctx.fill(); // Toilet Base
        ctx.fillRect(630, 420, 40, 60); // Tank

        // 3. Draw Character (Detailed with Plunger)
        ctx.fillStyle = "#5d4037"; // Skin
        ctx.fillRect(player.x, player.y, 50, 100); 
        ctx.fillStyle = "black"; // Durag
        ctx.fillRect(player.x - 5, player.y - 10, 60, 20);
        
        // Holding Plunger
        if (player.holdingPlunger) {
            ctx.strokeStyle = "#8b4513"; ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(player.x + 40, player.y + 50);
            ctx.lineTo(player.x + 80, player.y + 20);
            ctx.stroke();
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(player.x + 80, player.y + 20, 15, 0, Math.PI * 2);
            ctx.fill(); // Plunger head
        }

        // 4. UI Layer (Inventory & Money)
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(10, 10, 200, 80);
        ctx.fillStyle = "white";
        ctx.fillText("INVENTORY: [Plunger]", 20, 40);
        ctx.fillText("MONEY: $" + game.money, 20, 70);
        ctx.fillText("LOCATION: " + game.locations[game.level], 20, 90);
    }

    // Movement Logic
    window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") player.x += player.speed;
        if (e.key === "ArrowLeft") player.x -= player.speed;
        if (e.key === " " && player.x > 550) {
            game.money += 10;
            if (game.money >= 50) {
                game.level++;
                game.money = 0;
                player.x = 100;
                alert("You moved to: " + game.locations[game.level]);
            }
        }
        draw();
    });

    draw();
</script>
</body>
</html>
