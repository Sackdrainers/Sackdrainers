<!DOCTYPE html>
<html>
<head>
    <title>Sack Drainers</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: 'Arial', sans-serif; text-align: center; }
        #game-container { position: relative; width: 800px; height: 600px; margin: 20px auto; border: 4px solid #fff; background: #3a3a3a; }
        .ui-box { position: absolute; border: 3px solid #666; padding: 10px; background: rgba(0,0,0,0.7); }
        #inventory { top: 20px; left: 20px; width: 150px; }
        #score-map { bottom: 20px; left: 20px; width: 200px; height: 100px; }
        #level-info { top: 20px; right: 20px; width: 200px; }
        button { cursor: pointer; padding: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="intro-screen">
            <h1>SACK DRAINERS</h1>
            <p>Select your starting contract:</p>
            <button onclick="startGame(0)">Gas Station Restroom</button>
            <button onclick="startGame(1)">Random Home</button>
            <button onclick="startGame(2)">President's House</button>
        </div>

        <!-- Game Interface -->
        <div id="game-board" style="display:none;">
            <div id="inventory" class="ui-box">Inventory: [ Plunger ]</div>
            <div id="level-info" class="ui-box">Location: <span id="loc-name"></span><br>Goal: Collect $50</div>
            <div id="score-map" class="ui-box">Map Progress: <span id="progress">0%</span></div>
            
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const locations = ["Gas Station", "Random Home", "President's House"];
        let gameState = { money: 0, level: 0, active: false };

        function startGame(level) {
            gameState.level = level;
            document.getElementById("intro-screen").style.display = "none";
            document.getElementById("game-board").style.display = "block";
            document.getElementById("loc-name").innerText = locations[level];
            gameState.active = true;
            gameLoop();
        }

        function gameLoop() {
            if (!gameState.active) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Character Placeholder
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(350, 300, 50, 100); // Simple body
            
            requestAnimationFrame(gameLoop);
        }

        // Logic for collecting money
        window.addEventListener("keydown", (e) => {
            if (e.key === " ") {
                gameState.money += 10;
                document.getElementById("progress").innerText = (gameState.money * 2) + "%";
                if (gameState.money >= 50) alert("Contract Complete!");
            }
        });
    </script>
</body>
</html>
