<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sack Drainers</title>
    <style>
        body { margin: 0; background: #111; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { background: #333; border: 4px solid #fff; cursor: crosshair; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game State
    let gameState = {
        playerX: 100,
        money: 0,
        level: 0,
        locations: ["Gas Station", "Random Home", "President's House"]
    };

    function draw() {
        // Clear screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Background (Bathroom floor)
        ctx.fillStyle = "#888";
        ctx.fillRect(0, 450, 800, 150);

        // 2. Draw Toilet (Detailed)
        ctx.fillStyle = "#fff";
        ctx.fillRect(600, 420, 100, 80); // Toilet base
        ctx.fillStyle = "#ddd";
        ctx.fillRect(620, 380, 60, 40); // Toilet tank

        // 3. Draw Character (Detailed with Durag)
        ctx.fillStyle = "#5d4037"; // Skin
        ctx.fillRect(gameState.playerX, 350, 50, 100);
        ctx.fillStyle = "black"; // Durag
        ctx.fillRect(gameState.playerX - 5, 340, 60, 20);

        // 4. Draw Plunger (Held by player)
        ctx.strokeStyle = "#8b4513"; ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(gameState.playerX + 40, 400);
        ctx.lineTo(gameState.playerX + 80, 360);
        ctx.stroke();
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(gameState.playerX + 80, 360, 12, 0, Math.PI * 2);
        ctx.fill();

        // 5. Draw UI
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(10, 10, 250, 100);
        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("INVENTORY: Plunger", 20, 40);
        ctx.fillText("MONEY: $" + gameState.money, 20, 70);
        ctx.fillText("LOC: " + gameState.locations[gameState.level], 20, 100);

        requestAnimationFrame(draw);
    }

    // Movement & Interaction
    window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") gameState.playerX += 20;
        if (e.key === "ArrowLeft") gameState.playerX -= 20;
        
        // Interaction
        if (e.key === " " && gameState.playerX > 500) {
            gameState.money += 10;
            if (gameState.money >= 50) {
                gameState.level = (gameState.level + 1) % gameState.locations.length;
                gameState.money = 0;
                gameState.playerX = 100;
                alert("New Contract: " + gameState.locations[gameState.level]);
            }
        }
    });

    draw();
</script>
</body>
</html>
